# Weekly dependency updates, security advisories first. Minor and patch bumps
# arrive as one grouped pull request so they are reviewed together; a major
# bump (Prisma 7, say) comes on its own because it needs reading.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
